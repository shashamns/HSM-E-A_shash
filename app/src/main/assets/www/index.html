<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A50D26">
<title>HSM E&amp;A</title>
<script>try{var t=JSON.parse(localStorage.getItem("hsm_theme")||"null"),c={blue:"#1E5BD8",green:"#13834A",purple:"#6D3FC0",orange:"#D9620B",teal:"#0F7C86",steel:"#37474F"};if(c[t]){document.documentElement.setAttribute("data-theme",t);document.write("<style>html,body{background:"+c[t]+"!important}</style>")}}catch(e){}</script>
<style>html,body{margin:0;height:100%;background:#C8102E}.boot{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font:700 44px system-ui,sans-serif}</style>
</head>
<body>
<div class="app" id="app"><div class="boot">E&amp;A</div></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<script src="lib/exceljs.min.js"></script>
<script src="boot.js"></script>
</body>
</html>
