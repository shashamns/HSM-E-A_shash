plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hsm.ea'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hsm.ea'
        minSdk 26
        targetSdk 34
        versionCode 25
        versionName '3.12'
    }

    signingConfigs {
        hsm {
            // Signing key comes from GitHub Secrets at build time (never stored in the repo).
            def ksFile = System.getenv('HSM_KEYSTORE_FILE')
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('HSM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('HSM_KEY_ALIAS')
                keyPassword System.getenv('HSM_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.hsm
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
}
